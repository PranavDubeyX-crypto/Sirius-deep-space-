{id:'oort-cloud',name:'The Oort Cloud',kind:'Hypothesized comet reservoir',r:1,color:0xa4bfff,x:0,z:295,description:'A hypothesized roughly spherical reservoir of icy bodies surrounding the Solar System at enormous distances. Long-period comets are thought to originate from it.',stats:[['Inner edge','Uncertain'],['Outer extent','Possibly ~100,000 AU'],['Direct image','Not observed as a cloud']],note:'Inferred from comet orbits. The cloud’s boundaries and structure are uncertain; visualization is not to scale.'}

regions.forEach(d=>{let m=new THREE.Mesh(new THREE.SphereGeometry(1.25,12,10),new THREE.MeshBasicMaterial({color:d.color,wireframe:true,transparent:true,opacity:.5}));m.position.set(d.x,0,d.z);m.userData.id=d.id;m.userData.d=d;world.add(m);clickables.push(m);let l=label(d.name);l.position.set(d.x,3,d.z);m.userData.lab=l;bodies.push({mesh:m,d,lab:l,phase:0})});

function catalog(){let groups=[['STAR',[sun]],['PLANETS',planets],['DWARF PLANETS & SMALL WORLDS',dwarfs],['REGIONS',regions]];for(const [title,arr] of groups){let h=document.createElement('div');h.className='group';h.textContent=title;$('items').appendChild(h);for(let d of arr){let b=document.createElement('button');b.className='obj';b.dataset.id=d.id;b.innerHTML=`<span class="dot" style="background:${color(d)}"></span>${d.name}`;b.onclick=()=>select(d.id,true);$('items').appendChild(b)}}}
function select(id,move=false){let o=bodies.find(o=>o.d.id===id);if(!o)return;selected=o;document.querySelectorAll('.obj').forEach(b=>b.classList.toggle('active',b.dataset.id===id));let d=o.d;$('kind').textContent=d.kind||'Solar System object';$('name').textContent=d.name;$('desc').textContent=d.description||'Solar System object';$('stats').innerHTML=(d.stats||[['Diameter',d.diam||'—'],['Year',d.year||'—'],['Rotation',d.day||'—'],['Temperature',d.temp||'—']]).map(s=>`<div class="stat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('');$('note').textContent=d.note||'Illustrative visualization; values may be approximate and hypotheses are identified as such.';if(move){let p=o.mesh.position;target.set(p.x,0,p.z);camera.position.set(p.x,p.y+Math.max(8,d.r*5),p.z+Math.max(18,d.r*7));camera.lookAt(target)}}

renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=dx0=e.clientX;ly=dy0=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{
if(!drag)return;
let dx=e.clientX-lx,dy=e.clientY-ly;
lx=e.clientX;ly=e.clientY;
if(Math.hypot(e.clientX-dx0,e.clientY-dy0)>5){
let off=camera.position.clone().sub(target);
let s=new THREE.Spherical().setFromVector3(off);
s.theta-=dx*.006;
s.phi=Math.max(.12,Math.min(Math.PI-.12,s.phi+dy*.006));
off.setFromSpherical(s);
camera.position.copy(target).add(off);
camera.lookAt(target);
}
});

renderer.domElement.addEventListener('pointerup',e=>{
drag=false;
if(Math.hypot(e.clientX-dx0,e.clientY-dy0)<7){
pointer.x=e.clientX/innerWidth*2-1;
pointer.y=-(e.clientY/innerHeight)*2+1;
ray.setFromCamera(pointer,camera);
let hits=ray.intersectObjects(clickables);
if(hits.length)select(hits[0].object.userData.id,false);
}
});

renderer.domElement.addEventListener('wheel',e=>{
e.preventDefault();
camera.position.sub(target).multiplyScalar(e.deltaY>0?1.08:.92).add(target);
camera.lookAt(target);
},{passive:false});

renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

let clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);
let t=clock.getElapsedTime();

if(!paused){
for(let o of bodies){
let orb=o.mesh.userData.orbit;

  if(orb){
    let speed=.022/Math.sqrt(Math.max(1,orb.a));
    let a=o.phase+t*speed;

    o.mesh.position.x=Math.cos(a)*orb.a;
    o.mesh.position.z=Math.sin(a)*orb.a;

    o.lab.position.set(
      o.mesh.position.x,
      o.mesh.position.y+(o.d.r||1)+2,
      o.mesh.position.z
    );

    o.mesh.rotation.y+=.0015;
  }else if(o.d.id==='oort-cloud'){
    o.mesh.rotation.y+=.0002;
  }
}

}

camera.lookAt(target);
renderer.render(scene,camera);
}

animate();

setTimeout(()=>{
$('loading').style.display='none';
},900);

})();
