
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050812">
<title>SIRIUS — Deep Space Explorer</title>
<style>
:root{color-scheme:dark;--cyan:#71e6ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050b;color:#eef7ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
#space{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;pointer-events:none;z-index:3}
.brand{font-weight:850;letter-spacing:.22em;font-size:15px}
.brand span{color:var(--cyan)}
.tag{font-size:10px;letter-spacing:.16em;color:#a9bad0;border:1px solid #24384d;border-radius:99px;padding:7px 10px;background:#08101dbb}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;color:#a9bad0;background:#08101dcc;border:1px solid #25394e;border-radius:99px;padding:10px 14px;font-size:11px;white-space:nowrap;pointer-events:none}
#panel{position:fixed;z-index:4;left:16px;bottom:64px;width:min(340px,calc(100vw - 32px));padding:18px;border:1px solid #28435a;border-radius:17px;background:linear-gradient(145deg,#0b1625ee,#050912ee);box-shadow:0 15px 50px #0008;backdrop-filter:blur(14px);display:none}
#panel .eyebrow{font-size:10px;letter-spacing:.2em;color:var(--cyan);margin-bottom:8px}
#planetName{font-size:26px;font-weight:750;margin:0 0 8px}
#planetInfo{font-size:13px;line-height:1.55;color:#b9c7d9;margin:0}
#stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.stat{font-size:10px;color:#d9e7f7;border:1px solid #263d52;border-radius:8px;padding:7px 9px}
#close{position:absolute;right:12px;top:10px;border:0;background:#142337;color:#dcecff;border-radius:8px;padding:6px 9px;font-size:16px}
#controls{position:fixed;right:16px;bottom:64px;z-index:3;display:flex;flex-direction:column;gap:8px}
.ctrl{width:42px;height:42px;border-radius:12px;border:1px solid #29435b;background:#091423d9;color:#dff8ff;font-size:20px}
#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#03050b;transition:opacity .4s}
.loaderBox{text-align:center;padding:24px}
.loaderLogo{font-size:24px;letter-spacing:.28em;font-weight:850}
.loaderLogo span{color:var(--cyan)}
#loadText{color:#90a5be;font-size:11px;letter-spacing:.14em;margin-top:13px}
.spinner{width:28px;height:28px;border:2px solid #243649;border-top-color:var(--cyan);border-radius:50%;margin:22px auto 0;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#error{display:none;max-width:330px;color:#ffb9b9;font-size:13px;line-height:1.5;margin:18px auto 0}
#footer{position:fixed;top:62px;left:20px;color:#71849b;font-size:10px;letter-spacing:.12em;pointer-events:none}
@media(max-width:520px){
#top{padding:15px}.brand{font-size:13px}.tag{font-size:9px}
#footer{left:15px;top:55px;font-size:9px}
#panel{bottom:66px;padding:15px}#planetName{font-size:23px}
#hint{bottom:15px;font-size:10px}#controls{right:12px;bottom:68px}
}
</style>
</head>
<body>
<canvas id="space" aria-label="Interactive 3D solar system"></canvas>
<header id="top">
<div class="brand">SIRIUS<span>.</span></div>
<div class="tag">DEEP SPACE EXPLORER</div>
</header>
<div id="footer">SOL SYSTEM / INTERACTIVE MODEL</div>
<div id="hint">DRAG TO ROTATE · PINCH OR +/- TO ZOOM · TAP A PLANET</div>
<div id="controls">
<button class="ctrl" id="zoomIn" aria-label="Zoom in">+</button>
<button class="ctrl" id="zoomOut" aria-label="Zoom out">−</button>
<button class="ctrl" id="reset" aria-label="Reset view">↺</button>
</div>
<section id="panel">
<button id="close" aria-label="Close information">×</button>
<div class="eyebrow">CELESTIAL BODY</div>
<h2 id="planetName">Earth</h2>
<p id="planetInfo"></p>
<div id="stats"></div>
</section>
<div id="loading">
<div class="loaderBox">
<div class="loaderLogo">SIRIUS<span>.</span></div>
<div id="loadText">INITIALIZING DEEP SPACE</div>
<div class="spinner" id="spinner"></div>
<div id="error"></div>
</div>
</div>

<script>
const loading=document.getElementById('loading');
const loadText=document.getElementById('loadText');
const errorBox=document.getElementById('error');
const spinner=document.getElementById('spinner');

function showError(err){
spinner.style.display='none';
loadText.textContent='SPACE ENGINE FAILED TO START';
errorBox.style.display='block';
errorBox.textContent='Could not load the 3D engine. Check your internet connection, then refresh. Details: '+String(err).slice(0,180);
}
function hideLoading(){
loading.style.opacity='0';
setTimeout(()=>loading.style.display='none',450);
}
</script>

<script type="module">
(async()=>{
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
const canvas=document.getElementById('space');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x03050b);
scene.fog=new THREE.FogExp2(0x03050b,0.0019);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,500);
camera.position.set(0,23,47);

const renderer=new THREE.WebGLRenderer({
canvas,antialias:innerWidth>650,alpha:false,powerPreference:'low-power'
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;

scene.add(new THREE.AmbientLight(0x8094bd,1.0));
const sunLight=new THREE.PointLight(0xffd6a0,240,180,1.5);
scene.add(sunLight);

const starGeo=new THREE.BufferGeometry();
const starCount=2400;
const starPos=new Float32Array(starCount*3);

for(let i=0;i<starCount;i++){
const r=100+Math.random()*130;
const a=Math.random()*Math.PI*2;
const b=Math.acos(2*Math.random()-1);
starPos[i*3]=r*Math.sin(b)*Math.cos(a);
starPos[i*3+1]=r*Math.cos(b);
starPos[i*3+2]=r*Math.sin(b)*Math.sin(a);
}
starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({
color:0xc9e4ff,size:.28,sizeAttenuation:true
}));
scene.add(stars);

const sunGlow=new THREE.Mesh(
new THREE.SphereGeometry(2.35,32,24),
new THREE.MeshBasicMaterial({color:0xffb34f,transparent:true,opacity:.12})
);
scene.add(sunGlow);

const bodyData=[
{name:'Sun',r:1.8,d:0,speed:0,color:0xffb52e,
info:'The star at the centre of our Solar System. Its gravity holds the planets in orbit, and nuclear fusion in its core releases the energy that lights and warms our worlds.',
stats:['Star','Age: ~4.6 billion years','Diameter: ~1.39 million km']},
{name:'Mercury',r:.32,d:4.2,speed:.9,color:0x9c9994,
info:'The smallest planet and the closest to the Sun. Its surface is heavily cratered, and temperatures swing dramatically between day and night.',
stats:['Terrestrial planet','Year: 88 Earth days','Moons: 0']},
{name:'Venus',r:.55,d:6.2,speed:.65,color:0xe7b878,
info:'A rocky world wrapped in a dense carbon-dioxide atmosphere. Its runaway greenhouse effect makes it the hottest planet in our Solar System.',
stats:['Terrestrial planet','Year: 225 Earth days','Moons: 0']},
{name:'Earth',r:.59,d:8.6,speed:.48,color:0x3189ff,
info:'Our home world: the only world currently known to support life. Liquid water covers most of its surface, and its atmosphere protects a diverse biosphere.',
stats:['Terrestrial planet','Year: 365.25 days','Moons: 1']},
{name:'Mars',r:.44,d:11,speed:.38,color:0xd45d38,
info:'The Red Planet, with giant volcanoes, ancient river channels and polar ice. Robotic missions study whether microbial life could once have existed there.',
stats:['Terrestrial planet','Year: 687 Earth days','Moons: 2']},
{name:'Jupiter',r:1.25,d:16,speed:.22,color:0xcda77f,
info:'The largest planet, a gas giant with powerful storms including the Great Red Spot. Its many moons include ocean worlds that scientists are eager to explore.',
stats:['Gas giant','Year: 11.86 Earth years','Moons: 95+']},
{name:'Saturn',r:1.02,d:21,speed:.16,color:0xe1cb97,
info:'A gas giant famous for its broad rings made mostly of ice and rocky fragments. Saturn’s moon Titan has rivers and lakes of liquid hydrocarbons.',
stats:['Gas giant','Year: 29.4 Earth years','Moons: 140+']},
{name:'Uranus',r:.76,d:26,speed:.11,color:0x8bdbdf,
info:'An ice giant with a blue-green atmosphere and an extreme axial tilt, making it appear to roll along its orbit as it travels around the Sun.',
stats:['Ice giant','Year: 84 Earth years','Moons: 27']},
{name:'Neptune',r:.74,d:30,speed:.085,color:0x426cff,
info:'A distant ice giant with supersonic winds and a deep blue atmosphere. It takes about 165 Earth years to complete one orbit around the Sun.',
stats:['Ice giant','Year: 165 Earth years','Moons: 14']}
];

const bodies=[];
const mat=(color,rough=.85)=>new THREE.MeshStandardMaterial({
color,roughness:rough,metalness:.02
});

for(const data of bodyData){
const mesh=new THREE.Mesh(
new THREE.SphereGeometry(data.r,data.r>1?32:24,data.r>1?24:18),
data.name==='Sun'
?new THREE.MeshBasicMaterial({color:data.color})
:mat(data.color)
);
mesh.userData.body=data;
scene.add(mesh);

if(data.name!=='Sun'){
const points=[];
for(let i=0;i<=180;i++){
const a=i/180*Math.PI*2;
points.push(new THREE.Vector3(Math.cos(a)*data.d,0,Math.sin(a)*data.d));
}
const orbit=new THREE.LineLoop(
new THREE.BufferGeometry().setFromPoints(points),
new THREE.LineBasicMaterial({color:0x31435d,transparent:true,opacity:.55})
);
scene.add(orbit);
}

if(data.name==='Saturn'){
const ring=new THREE.Mesh(
new THREE.RingGeometry(data.r*1.25,data.r*1.9,64),
new THREE.MeshBasicMaterial({
color:0xcdbb94,side:THREE.DoubleSide,transparent:true,opacity:.7
})
);
ring.rotation.x=Math.PI/2.35;
mesh.add(ring);
}
bodies.push({data,mesh,angle:Math.random()*Math.PI*2});
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let rotX=.42,rotY=0,targetRotX=.42,targetRotY=0;
let distance=47,targetDistance=47;
let dragging=false,moved=0,lastX=0,lastY=0;
let pinchDist=0,pinchStart=0;

function setInfo(data){
document.getElementById('planetName').textContent=data.name;
document.getElementById('planetInfo').textContent=data.info;
const s=document.getElementById('stats');
s.replaceChildren();
for(const t of data.stats){
const e=document.createElement('span');
e.className='stat';
e.textContent=t;
s.appendChild(e);
}
document.getElementById('panel').style.display='block';
}

function pick(x,y){
const rect=canvas.getBoundingClientRect();
pointer.x=(x-rect.left)/rect.width*2-1;
pointer.y=-(y-rect.top)/rect.height*2+1;
raycaster.setFromCamera(pointer,camera);
const hits=raycaster.intersectObjects(bodies.map(b=>b.mesh),true);
if(hits.length){
let obj=hits[0].object;
while(obj&&!obj.userData.body)obj=obj.parent;
if(obj&&obj.userData.body)setInfo(obj.userData.body);
}
}

canvas.addEventListener('pointerdown',e=>{
dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;
canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
if(!dragging)return;
const dx=e.clientX-lastX,dy=e.clientY-lastY;
moved+=Math.abs(dx)+Math.abs(dy);
targetRotY+=dx*.005;
targetRotX=THREE.MathUtils.clamp(targetRotX+dy*.004,-1.15,1.15);
lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener('pointerup',e=>{
dragging=false;
if(moved<8)pick(e.clientX,e.clientY);
});
canvas.addEventListener('pointercancel',()=>dragging=false);
canvas.addEventListener('wheel',e=>{
targetDistance=THREE.MathUtils.clamp(targetDistance+e.deltaY*.035,12,85);
},{passive:true});

function zoom(f){
targetDistance=THREE.MathUtils.clamp(targetDistance*f,12,85);
}
document.getElementById('zoomIn').onclick=()=>zoom(.82);
document.getElementById('zoomOut').onclick=()=>zoom(1.22);
document.getElementById('reset').onclick=()=>{
targetRotX=.42;targetRotY=0;targetDistance=47;
};
document.getElementById('close').onclick=()=>{
document.getElementById('panel').style.display='none';
};

canvas.addEventListener('touchstart',e=>{
if(e.touches.length===2){
pinchDist=Math.hypot(
e.touches[0].clientX-e.touches[1].clientX,
e.touches[0].clientY-e.touches[1].clientY
);
pinchStart=targetDistance;
}
},{passive:true});

canvas.addEventListener('touchmove',e=>{
if(e.touches.length===2&&pinchDist){
const now=Math.hypot(
e.touches[0].clientX-e.touches[1].clientX,
e.touches[0].clientY-e.touches[1].clientY
);
targetDistance=THREE.MathUtils.clamp(
pinchStart*pinchDist/Math.max(now,1),12,85
);
}
},{passive:true});
canvas.addEventListener('touchend',()=>{pinchDist=0;},{passive:true});

function resize(){
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);

let prev=0;
function animate(time=0){
requestAnimationFrame(animate);
const dt=Math.min((time-prev)/1000||0,.05);
prev=time;

for(const b of bodies){
if(b.data.d>0){
b.angle+=b.data.speed*dt*.16;
b.mesh.position.set(
Math.cos(b.angle)*b.data.d,0,Math.sin(b.angle)*b.data.d
);
}
b.mesh.rotation.y+=dt*.18;
}

sunGlow.position.copy(bodies[0].mesh.position);
stars.rotation.y+=dt*.001;
rotX+=(targetRotX-rotX)*.08;
rotY+=(targetRotY-rotY)*.08;
distance+=(targetDistance-distance)*.08;

camera.position.set(
Math.sin(rotY)*Math.cos(rotX)*distance,
Math.sin(rotX)*distance,
Math.cos(rotY)*Math.cos(rotX)*distance
);
camera.lookAt(0,0,0);
renderer.render(scene,camera);
}

bodies[0].mesh.position.set(0,0,0);
document.getElementById('loadText').textContent='SYSTEM ONLINE';
animate();
hideLoading();

}catch(err){
console.error('Sirius startup error:',err);
showError(err);
}
})();
</script>
</body>
</html>
